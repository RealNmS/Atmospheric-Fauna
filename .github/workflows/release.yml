name: Release
on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "microsoft"
      
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build and publish to platforms
        run: ./gradlew buildAndCollect publishMods --no-parallel --no-daemon --dry-run
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      
      - name: Create Unified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MOD_VERSION=$(grep -m1 '^mod.version' stonecutter.properties.toml | cut -d '"' -f2)
          TAG="v$MOD_VERSION"

          # Enable extended globbing to cleanly ignore -sources.jar
          shopt -s extglob
          gh release create "$TAG" build/libs/$MOD_VERSION/!(*-sources).jar \
            --title "$TAG" \
            --notes-file CHANGELOG.md
