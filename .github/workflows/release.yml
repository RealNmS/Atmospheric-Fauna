name: Release
on: [workflow_dispatch] # Manual trigger
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: mcr.microsoft.com/openjdk/jdk:21-ubuntu
      options: --user root
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "microsoft"
      
      - name: make gradlew executable
        run: chmod +x gradlew

      - name: build and publish
        run: ./gradlew build publishMods --no-parallel
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      
      - name: Create Unified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract root mod version (e.g. 0.6.0) from stonecutter.properties.toml
          MOD_VERSION=$(grep -m1 '^mod.version' stonecutter.properties.toml | cut -d '"' -f2)
          TAG="v$MOD_VERSION"

          # Uploads only the mod jars (ignores -sources.jar files)
          gh release create "$TAG" build/libs/$MOD_VERSION/*[!sources].jar \
            --title "$TAG" \
            --notes-file CHANGELOG.md
